<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; margin: 0; border-radius: 0 !important; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    color: #ededed;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #backdrop {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #backdrop.visible { opacity: 1; }
  #drag { position: fixed; top: 0; left: 0; right: 0; height: 28px; -webkit-app-region: drag; }

  .panel {
    display: none;
    background: #111;
    border: 1px solid #2a2a2a;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    transform: translateY(6px) scale(0.985);
    transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .visible .panel { transform: none; }
  [data-mode="url"] #url, [data-mode="settings"] #settings { display: block; }

  #url { width: min(680px, 80vw); }
  #url input {
    width: 100%; padding: 18px 20px;
    background: transparent; border: 0; outline: 0;
    color: #fff; font: inherit; font-size: 17px;
    user-select: text;
  }
  #url input::placeholder { color: #666; }

  #settings { width: 420px; padding: 22px 24px 18px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 18px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
  .row label { color: #bbb; }
  .row output { color: #777; font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; }

  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 16px; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: #333; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px;
    background: #fff; border: 0;
  }
  input[type=range]:focus { outline: none; }

  .segmented { display: flex; border: 1px solid #333; }
  .segmented button {
    flex: 1; padding: 6px 12px; white-space: nowrap; background: transparent; border: 0; color: #999; font: inherit; cursor: pointer;
  }
  .segmented button.active { background: #fff; color: #000; }

  .switch { width: 30px; height: 16px; background: #333; border: 0; position: relative; cursor: pointer; }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; background: #888;
    transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), background 160ms;
  }
  .switch.on { background: #fff; }
  .switch.on::after { transform: translateX(14px); background: #000; }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: #555; font-size: 11px; }
  footer button { background: none; border: 0; color: #777; font: inherit; cursor: pointer; padding: 0; }
  footer button:hover { color: #fff; }
</style>
</head>
<body>
<div id="backdrop">
  <div id="drag"></div>

  <div id="url" class="panel">
    <input id="url-input" type="text" spellcheck="false" autocomplete="off" placeholder="Paste a URL or search">
  </div>

  <div id="settings" class="panel">
    <h1>Scrolling</h1>
    <div class="row">
      <label for="mouseSpeed">Mouse wheel speed</label><output data-for="mouseSpeed"></output>
      <input id="mouseSpeed" type="range" min="0.1" max="3" step="0.05">
    </div>
    <div class="row">
      <label for="trackpadSpeed">Trackpad speed</label><output data-for="trackpadSpeed"></output>
      <input id="trackpadSpeed" type="range" min="0.1" max="3" step="0.05">
    </div>
    <div class="row">
      <label for="keyboardSpeed">Arrow key speed</label><output data-for="keyboardSpeed"></output>
      <input id="keyboardSpeed" type="range" min="0.25" max="3" step="0.05">
    </div>
    <div class="row">
      <label for="smoothness">Smoothness</label><output data-for="smoothness"></output>
      <input id="smoothness" type="range" min="100" max="2000" step="10">
    </div>
    <div class="row">
      <label for="maxVelocity">Speed limit</label><output data-for="maxVelocity"></output>
      <input id="maxVelocity" type="range" min="0" max="8000" step="100">
    </div>
    <div class="row">
      <label>Easing</label>
      <div class="segmented" id="easing">
        <button data-value="spring">Ease in-out</button>
        <button data-value="exponential">Ease out</button>
      </div>
    </div>
    <div class="row">
      <label>Hide scrollbars</label>
      <button class="switch" id="hideScrollbars"></button>
    </div>
    <footer>
      <span>⌘L address · ⌘, settings · esc close</span>
      <button id="reset">Reset</button>
    </footer>
  </div>
</div>

<script>
  const backdrop = document.getElementById('backdrop');
  const urlInput = document.getElementById('url-input');
  const sliders = ['mouseSpeed', 'trackpadSpeed', 'keyboardSpeed', 'smoothness', 'maxVelocity'];
  const format = {
    mouseSpeed: (v) => `${(+v).toFixed(2)}×`,
    trackpadSpeed: (v) => `${(+v).toFixed(2)}×`,
    keyboardSpeed: (v) => `${(+v).toFixed(2)}×`,
    smoothness: (v) => `${v} ms`,
    maxVelocity: (v) => (+v ? `${v} px/s` : 'Off'),
  };

  function render(settings) {
    for (const key of sliders) {
      document.getElementById(key).value = settings[key];
      document.querySelector(`output[data-for="${key}"]`).textContent = format[key](settings[key]);
    }
    for (const b of document.querySelectorAll('#easing button')) {
      b.classList.toggle('active', b.dataset.value === settings.easing);
    }
    document.getElementById('hideScrollbars').classList.toggle('on', settings.hideScrollbars);
  }

  let current = {};
  function set(partial) {
    current = { ...current, ...partial };
    render(current);
    narc.setSettings(partial);
  }

  for (const key of sliders) {
    document.getElementById(key).addEventListener('input', (e) => set({ [key]: +e.target.value }));
  }
  document.getElementById('easing').addEventListener('click', (e) => {
    if (e.target.dataset.value) set({ easing: e.target.dataset.value });
  });
  document.getElementById('hideScrollbars').addEventListener('click', () => set({ hideScrollbars: !current.hideScrollbars }));
  document.getElementById('reset').addEventListener('click', () => narc.resetSettings());

  narc.onSettings((s) => { current = s; render(s); });

  narc.onShow(({ mode, url, settings }) => {
    current = settings;
    render(settings);
    backdrop.dataset.mode = mode;
    backdrop.classList.remove('visible');
    requestAnimationFrame(() => backdrop.classList.add('visible'));
    if (mode === 'url') {
      urlInput.value = url;
      urlInput.focus();
      urlInput.select();
    } else {
      document.activeElement && document.activeElement.blur();
    }
  });

  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && urlInput.value.trim()) narc.navigate(urlInput.value);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') narc.hide();
  });

  backdrop.addEventListener('mousedown', (e) => {
    if (e.target === backdrop) narc.hide();
  });
</script>
</body>
</html>
