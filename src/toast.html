<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #toast {
    padding: 9px 14px;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #ededed;
    font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1), transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #toast.visible { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="toast"></div>
<script>
  const toast = document.getElementById('toast');
  let timer;
  function show(text) {
    toast.textContent = text;
    toast.classList.add('visible');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('visible'), 1800);
  }
</script>
</body>
</html>
