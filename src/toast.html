<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #toast {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #ededed;
    font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    white-space: nowrap;
    -webkit-font-smoothing: antialiased;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1), transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #toast.visible { opacity: 1; transform: none; pointer-events: auto; }
  #toast.asking { padding: 5px 5px 5px 14px; }
  #actions { display: none; gap: 4px; }
  #toast.asking #actions { display: flex; }
  #actions button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    color: #a0a0a0;
    cursor: pointer;
  }
  #actions button:hover { background: #262626; color: #ededed; }
  #yes:hover { color: #7ee2a8 !important; }
  #no:hover { color: #ff8a8a !important; }
  #actions svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div id="toast">
  <span id="text"></span>
  <span id="actions">
    <button id="no" title="Keep timeline"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    <button id="yes" title="Clear and set marker"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-6"/></svg></button>
  </span>
</div>
<script>
  const toast = document.getElementById('toast');
  const text = document.getElementById('text');
  let timer;
  function show(msg) {
    text.textContent = msg;
    toast.classList.remove('asking');
    toast.classList.add('visible');
    clearTimeout(timer);
    timer = setTimeout(hide, 1800);
  }
  function ask(msg) {
    text.textContent = msg;
    toast.classList.add('asking', 'visible');
    clearTimeout(timer);
  }
  function hide() {
    clearTimeout(timer);
    toast.classList.remove('visible');
  }
  document.getElementById('yes').addEventListener('click', () => narc.answer(true));
  document.getElementById('no').addEventListener('click', () => narc.answer(false));
</script>
</body>
</html>
